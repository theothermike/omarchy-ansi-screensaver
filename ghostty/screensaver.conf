# ghostty configuration for the ANSI screensaver window (loaded on top of the
# user's own config; the launcher appends font lines at runtime).
window-padding-x = 0
window-padding-y = 0
window-padding-color = extend-always
background = #000000
foreground = #aaaaaa
cursor-style = block
cursor-style-blink = false
confirm-close-surface = false
shell-integration = none
scrollback-limit = 0
link-url = false
copy-on-select = false
mouse-hide-while-typing = false
resize-overlay = never
window-inherit-font-size = false
bell-features = no-system,no-audio
title = ANSI Screensaver
